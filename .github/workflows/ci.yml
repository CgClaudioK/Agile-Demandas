name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: backend
            sources: src
          - project: frontend
            sources: app
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install and lint
        run: |
          npm ci
          npm run lint

      - name: Test
        run: npm test --if-present -- --coverage --coverage.reporter=lcov --coverage.reporter=text --passWithNoTests

      - name: SonarCloud scan
        if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: ${{ matrix.project }}
          args: >
            -Dsonar.projectKey=${{ github.repository_owner }}_Agile-Demand-${{ matrix.project }}
            -Dsonar.organization=cgclaudiok
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.sources=${{ matrix.sources }}
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
